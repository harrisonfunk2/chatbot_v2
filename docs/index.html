
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Knowledge Base Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>

<body>
    <div class="app">
        <header class="site-header">
            <div class="brand">
                <span>Knowledge Base</span>
            </div>

            <span class="header-label">AI powered document search</span>
        </header>

        <main class="chat-layout">
            <section id="welcome" class="welcome">
                <h1>AI Knowledge Base Assistant</h1>
                <p>
                    Explore technical documents with AI powered
                    search and source-grounded answers.
                </p>

                <div class="examples">
                    <p class="section-label">TRY ASKING</p>

                    <button
                        class="example"
                        data-question="What are vector embeddings?"
                    >
                        <span>What are vector embeddings?</span>
                        <span aria-hidden="true">↗</span>
                    </button>

                    <button
                        class="example"
                        data-question="How does MLflow track experiments?"
                    >
                        <span>How does MLflow track experiments?</span>
                        <span aria-hidden="true">↗</span>
                    </button>

                    <button
                        class="example"
                        data-question="What is the difference between ETL and ELT?"
                    >
                        <span>What is the difference between ETL and ELT?</span>
                        <span aria-hidden="true">↗</span>
                    </button>
                </div>
            </section>

            <section
                id="messages"
                class="messages"
                aria-live="polite"
                aria-label="Conversation"
            ></section>
        </main>

        <div class="composer-area">
            <form id="chat-form" class="chat-form">
                <input
                    id="question"
                    type="text"
                    placeholder="Ask a question about the documents..."
                    maxlength="500"
                    autocomplete="off"
                    aria-label="Your question"
                    required
                >

                <button
                    id="send-button"
                    type="submit"
                    aria-label="Send message"
                >
                    ↑
                </button>
            </form>

            <p id="status" role="status"></p>

        </div>

        <footer class="site-footer">
            <p>
                Built with OpenAI, LlamaIndex, Pinecone,
                FastAPI, and Google Cloud Run.
            </p>

            <a
                href="https://github.com/harrisonfunk2/chatbot_v2"
                target="_blank"
                rel="noopener noreferrer"
            >
                GitHub ↗
            </a>
        </footer>
    </div>
</body>
</html>
